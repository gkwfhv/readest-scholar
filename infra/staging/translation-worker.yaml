# Isolated synthetic staging translation worker. No public ports.
# Set SCHOLAR_AI_VAULT_KEY_FILE and SCHOLAR_TRANSLATION_WORKER_TOKEN_FILE
# to distinct 0600 files before starting this overlay.
services:
  client:
    environment:
      SCHOLAR_AI_VAULT_KEY_FILE: /run/secrets/scholar_ai_vault_key
      SCHOLAR_TRANSLATION_WORKER_TOKEN_FILE: /run/secrets/translation_client_token
    secrets:
      - scholar_ai_vault_key
      - translation_client_token

  translation_asset_warmup:
    image: scholar-translation-worker:phase6
    build:
      context: ../..
      dockerfile: infra/translation-worker/Dockerfile
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      python /app/warmup-assets.py &&
      chown -R 1000:1000 /assets
    environment:
      HOME: /assets
      XDG_CACHE_HOME: /assets
      XDG_CONFIG_HOME: /assets
      BABELDOC_ASSET_WORKERS: "3"
    volumes:
      - scholar_translation_assets:/assets
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 48
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  translator:
    image: scholar-translation-worker:phase6
    build:
      context: ../..
      dockerfile: infra/translation-worker/Dockerfile
    user: "0:0"
    depends_on:
      db:
        condition: service_started
      minio:
        condition: service_started
      client:
        condition: service_started
      translation_asset_warmup:
        condition: service_completed_successfully
    environment:
      SCHOLAR_TRANSLATION_ASSET_DIR: /assets
      SCHOLAR_TRANSLATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      SCHOLAR_TRANSLATION_INTERNAL_BASE_URL: http://client:3000
      SCHOLAR_TRANSLATION_WORKER_TOKEN_FILE: /run/secrets/translation_worker_token
      SCHOLAR_TRANSLATION_CACHE_DIR: /tmp
      SCHOLAR_TRANSLATION_TIMEOUT_SECONDS: "1800"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    secrets:
      - translation_worker_token
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=650m
    volumes:
      - scholar_translation_assets:/assets:ro
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  scholar_ai_vault_key:
    file: ${SCHOLAR_AI_VAULT_KEY_FILE:?Point to a private 0600 vault key}
  translation_client_token:
    file: ${SCHOLAR_TRANSLATION_CLIENT_TOKEN_FILE:?Point to a private 0600 client token}
  translation_worker_token:
    file: ${SCHOLAR_TRANSLATION_WORKER_TOKEN_FILE:?Point to a private 0400 worker token}

volumes:
  scholar_translation_assets:
