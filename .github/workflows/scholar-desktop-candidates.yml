name: Scholar desktop candidates

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

concurrency:
  group: scholar-desktop-candidates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'gkwfhv/readest-scholar' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-scholar-desktop'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            extension: dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CI: 'true'
      NEXT_PUBLIC_APP_PLATFORM: tauri
      NEXT_PUBLIC_SCHOLAR_RELEASE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: apps/readest-app/src-tauri
          key: scholar-desktop-${{ matrix.target }}

      - name: Install locked dependencies
        shell: bash
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Stage reader vendors
        shell: bash
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Build Scholar web assets
        shell: bash
        run: |
          cp apps/readest-app/.env.tauri apps/readest-app/.env.local
          pnpm --filter @readest/readest-app build-tauri

      - name: Build unsigned debug installer
        shell: bash
        working-directory: apps/readest-app
        run: pnpm tauri build --debug --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config src-tauri/scholar.release.json

      - name: Verify candidate identity and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          found=0
          while IFS= read -r bundle; do
            found=1
            case "$(basename "$bundle")" in
              *Scholar*) ;;
              *) echo "::error::Candidate has an unexpected product name: $bundle"; exit 1 ;;
            esac
            cp "$bundle" candidate/
          done < <(find target -type f -path "*/bundle/${{ matrix.bundle }}/*" -name "*.${{ matrix.extension }}" -print)
          test "$found" -gt 0
          if command -v sha256sum >/dev/null 2>&1; then
            (cd candidate && sha256sum *.${{ matrix.extension }} > SHA256SUMS)
          else
            (cd candidate && shasum -a 256 *.${{ matrix.extension }} > SHA256SUMS)
          fi
          {
            echo "Readest Scholar unsigned debug candidate"
            echo "commit=$(git rev-parse HEAD)"
            echo "runner=${{ matrix.os }}"
            echo "target=${{ matrix.target }}"
            echo "bundle=${{ matrix.bundle }}"
            echo "scope=packaging smoke only; not signed or device accepted"
          } > candidate/BUILD.txt
          cat candidate/SHA256SUMS

      - name: Install and launch macOS candidate
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/scholar-dmg"
          app_copy="$RUNNER_TEMP/Readest Scholar.app"
          mkdir -p "$mount"
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$mount" candidate/*.dmg
          trap 'hdiutil detach -quiet "$mount" >/dev/null 2>&1 || true' EXIT
          app=$(find "$mount" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          test "$bundle_id" = io.github.gkwfhv.readestscholar
          binary_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          cp -R "$app" "$app_copy"
          binary="$app_copy/Contents/MacOS/$binary_name"
          test -x "$binary"
          "$binary" > "$RUNNER_TEMP/scholar-macos-startup.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; hdiutil detach -quiet "$mount" >/dev/null 2>&1 || true' EXIT
          sleep 8
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/scholar-macos-startup.log"
            exit 1
          fi
          echo "Scholar macOS app stayed alive for 8 seconds"

      - name: Install, launch, and uninstall Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem candidate -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'scholar-smoke'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS install failed: $($install.ExitCode)" }
          $binary = Get-ChildItem $installDir -Recurse -File -Filter 'readest-scholar.exe' | Select-Object -First 1
          if (-not $binary) { throw 'Scholar executable missing after install' }
          $app = Start-Process -FilePath $binary.FullName -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited) { throw "Scholar exited during startup: $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          $uninstaller = Get-ChildItem $installDir -Recurse -File -Filter 'uninstall.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'NSIS uninstaller missing' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstall failed: $($uninstall.ExitCode)" }
          if (Test-Path $binary.FullName) { throw 'Scholar executable remained after uninstall' }
          Write-Output 'Scholar Windows install, startup, and uninstall passed'

      - name: Upload candidate installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scholar-desktop-${{ matrix.target }}-debug
          path: candidate/
          if-no-files-found: error
          retention-days: 7
