name: Scholar Linux candidate

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

concurrency:
  group: scholar-linux-candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'gkwfhv/readest-scholar' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-scholar-linux'))
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CI: 'true'
      NEXT_PUBLIC_APP_PLATFORM: tauri
      NEXT_PUBLIC_SCHOLAR_RELEASE: 'true'
      TAURI_CEF_CARGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: apps/readest-app/src-tauri
          key: scholar-linux-cef-candidate

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf xdg-utils xvfb dbus-x11

      - name: Install pinned CEF Tauri CLI
        run: |
          set -euo pipefail
          cargo install tauri-cli --git https://github.com/readest/tauri \
            --rev 6beeb209b5514f597a26f48b7a5b9fe4c59b5f12 --locked

      - name: Install locked dependencies and vendors
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @readest/readest-app setup-vendors

      - name: Build Scholar web assets
        run: |
          cp apps/readest-app/.env.tauri apps/readest-app/.env.local
          pnpm --filter @readest/readest-app build-tauri

      - name: Build unsigned debug DEB
        working-directory: apps/readest-app
        run: pnpm tauri build --debug --bundles deb --config src-tauri/scholar.release.json

      - name: Verify package identity and checksum
        run: |
          set -euo pipefail
          mkdir -p candidate
          mapfile -t bundles < <(find target -type f -path '*/bundle/deb/*' -name '*.deb' -print)
          test "${#bundles[@]}" -gt 0
          for bundle in "${bundles[@]}"; do
            package=$(dpkg-deb --field "$bundle" Package)
            case "$package" in
              *scholar*) ;;
              *) echo "::error::Unexpected package identity: $package"; exit 1 ;;
            esac
            cp "$bundle" candidate/
            dpkg-deb --field "$bundle" Package Version Architecture
          done
          (cd candidate && sha256sum *.deb > SHA256SUMS)
          {
            echo "Readest Scholar unsigned debug Linux candidate"
            echo "commit=$(git rev-parse HEAD)"
            echo "runner=ubuntu-22.04"
            echo "bundle=deb"
            echo "scope=packaging smoke only; not signed or desktop accepted"
          } > candidate/BUILD.txt
          cat candidate/SHA256SUMS

      - name: Install and launch candidate under Xvfb
        run: |
          set -euo pipefail
          sudo dpkg -i candidate/*.deb
          Xvfb :99 -screen 0 1280x800x24 >/tmp/scholar-xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          sleep 2
          DISPLAY=:99 dbus-run-session -- bash -euo pipefail -c '
            /usr/bin/readest-scholar >/tmp/scholar-app.log 2>&1 &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            sleep 8
            kill -0 "$app_pid"
            dbus-send --session --dest=org.freedesktop.DBus \
              --type=method_call --print-reply /org/freedesktop/DBus \
              org.freedesktop.DBus.ListNames > /tmp/scholar-dbus-names.log
            cat /tmp/scholar-dbus-names.log | grep -F 'SingleInstance'
            grep -Fq 'io.github.gkwfhv.readestscholar.SingleInstance' /tmp/scholar-dbus-names.log
            if grep -Fq 'com.bilingify.readest.SingleInstance' /tmp/scholar-dbus-names.log; then
              echo "::error::Upstream Readest D-Bus identity leaked into Scholar candidate"
              exit 1
            fi
          '

      - name: Upload candidate DEB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scholar-linux-x86_64-debug
          path: candidate/
          if-no-files-found: error
          retention-days: 7
