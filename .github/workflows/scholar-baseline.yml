name: Scholar baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  local-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject tracked private Compose environments
        run: |
          python3 infra/staging/check-tracked-env.py
          git check-ignore -q docker/.env
          git check-ignore -q docker/.env.restore
          git check-ignore -q docker/.env.phase1
          git check-ignore -q docker/.env.production
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
      - name: Check shell and Node syntax
        run: |
          bash -n infra/backup/backup-compose.sh infra/backup/test-backup-compose.sh infra/staging/export-images.sh infra/staging/import-dockerhub-from-mirror.sh infra/staging/rehearse-web-rollback.sh infra/release/verify-scholar-deb-transitions.sh
          node --check infra/compose/prepare-local-env.mjs
          node --check infra/compose/build-local-tauri.mjs
          node --check infra/compose/assert-loopback-ports.mjs
          node --check infra/compose/check-readiness.mjs
          node --check infra/staging/check-config.mjs
          node --check infra/release/verify-scholar-candidate.mjs
          node --check infra/release/test-verify-scholar-candidate.mjs
          node --check infra/release/check-scholar-release-identity.mjs
          node --check infra/release/test-scholar-release-identity.mjs
          node --check infra/release/verify-scholar-release-preflight.mjs
          node --check infra/release/test-scholar-release-preflight.mjs
          node infra/release/test-verify-scholar-candidate.mjs
          node infra/release/test-scholar-release-identity.mjs
          node infra/release/test-scholar-release-preflight.mjs
          python3 -c 'import ast,pathlib; [ast.parse(pathlib.Path(p).read_text()) for p in ("infra/staging/prepare-env.py", "infra/staging/prepare-restore-env.py", "infra/staging/verify-restore-probe.py", "infra/staging/check-readiness.py", "infra/staging/check-bind-mounts.py")]'
      - name: Exercise backup failure and success paths
        run: bash infra/backup/test-backup-compose.sh
      - name: Validate local Compose configuration and port bindings
        run: |
          node infra/compose/prepare-local-env.mjs
          docker compose --env-file docker/.env \
            -f docker/compose.yaml \
            -f infra/compose/localhost.yaml \
            -f infra/compose/silo-local-test.yaml \
            config --format json | node infra/compose/assert-loopback-ports.mjs
      - name: Validate isolated Linux staging configuration
        run: |
          SCHOLAR_STAGING_ENV_FILE="$RUNNER_TEMP/scholar-staging.env" python3 infra/staging/prepare-env.py
          test "$(stat -c %a "$RUNNER_TEMP/scholar-staging.env")" = 600
          python3 infra/staging/check-bind-mounts.py
          docker compose --env-file "$RUNNER_TEMP/scholar-staging.env" \
            -f docker/compose.yaml -f infra/staging/compose.yaml \
            config --format json | node infra/staging/check-config.mjs
          SCHOLAR_STAGING_ENV_FILE="$RUNNER_TEMP/scholar-staging.env" \
            SCHOLAR_RESTORE_ENV_FILE="$RUNNER_TEMP/scholar-restore.env" \
            python3 infra/staging/prepare-restore-env.py
          test "$(stat -c %a "$RUNNER_TEMP/scholar-restore.env")" = 600
          docker compose --env-file "$RUNNER_TEMP/scholar-restore.env" \
            -f docker/compose.yaml -f infra/staging/compose.yaml \
            -f infra/staging/restore-rehearsal.yaml \
            config --format json | SCHOLAR_COMPOSE_VARIANT=restore node infra/staging/check-config.mjs
      - name: Exercise Scholar document identity migrations and RLS
        timeout-minutes: 10
        env:
          SCHOLAR_TEST_POSTGRES_IMAGE: docker.io/supabase/postgres:15.8.1.085@sha256:caae3d066f437332d593011e3e7ecf78ab005ce9b89378efd53f97f0410563ad
        run: bash docker/volumes/db/tests/run-scholar-document-identity.sh

  source-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: List declared production npm licenses
        run: pnpm --filter @readest/readest-app licenses list --json --prod > scholar-licenses.json
      - name: Reject unreviewed Unknown production npm licenses
        run: node infra/release/check-scholar-npm-licenses.mjs scholar-licenses.json

      - name: Upload npm license report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scholar-npm-licenses
          path: scholar-licenses.json
          retention-days: 30
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Generate source-tree CycloneDX inventory
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: '"$SYFT" scan dir:. -o cyclonedx-json=scholar-source-sbom.cdx.json'
      - name: Check inventory contains locked dependencies
        run: |
          node -e 'const b=require("./scholar-source-sbom.cdx.json"); if (!Array.isArray(b.components) || b.components.length < 100) process.exit(1); console.log(`${b.components.length} components cataloged`);'
      - name: Upload source-tree inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scholar-source-sbom
          path: scholar-source-sbom.cdx.json
          retention-days: 30
