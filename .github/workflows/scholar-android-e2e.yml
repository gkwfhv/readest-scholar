name: Scholar Android E2E (CDP)

# On-device end-to-end tests: boots an x86_64 Android emulator (KVM), installs
# a debug APK, and runs the CDP-driven selection lane (pnpm test:android).
# Opt-in: runs on demand or when a PR is labeled e2e-scholar-android.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: scholar-android-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scholar-android-e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e-scholar-android')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # The legacy `tools` package (part of the action's default) no longer
          # exists in the SDK repository and makes sdkmanager fail.
          packages: 'platform-tools'

      - name: install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: apps/readest-app/src-tauri

      - name: create .env.local file for Next.js
        run: |
          cat > .env.local <<'ENV'
          NEXT_PUBLIC_APP_PLATFORM=tauri
          NEXT_PUBLIC_SCHOLAR_RELEASE=true
          NEXT_PUBLIC_SELF_HOSTED=true
          NEXT_PUBLIC_SUPABASE_URL=http://10.0.2.2:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY=synthetic-ci-only
          NEXT_PUBLIC_API_BASE_URL=http://10.0.2.2:3000
          ENV
          cp .env.local apps/readest-app/.env.local

      - name: build Scholar web assets
        run: pnpm --filter @readest/readest-app build

      - name: build debug APK (x86_64)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          cd apps/readest-app
          # Only the customized files of gen/android are tracked — regenerate
          # the gradle scaffolding, then restore the tracked customizations
          # (same flow as the release workflow).
          rm -rf src-tauri/gen/android
          pnpm tauri android init --ci --config src-tauri/scholar.release.json
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .
          node scripts/prepare-scholar-android.mjs
          # Debug build: signed with the debug keystore, no release secrets
          # needed (gradle only loads keystore.properties when it exists).
          pnpm tauri android build --debug --target x86_64 --config src-tauri/scholar.release.json
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-debug.apk' | head -n 1)
          echo "APK=$PWD/$APK" >> "$GITHUB_ENV"
          test -n "$APK"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)
          test -x "$AAPT2"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > "$RUNNER_TEMP/scholar-android-manifest.txt"
          grep -F 'readest-scholar' "$RUNNER_TEMP/scholar-android-manifest.txt"
          if grep -E 'web\.readest\.com|readest-onedrive|com\.googleusercontent\.apps\.209390247301|android:scheme.*"readest"' "$RUNNER_TEMP/scholar-android-manifest.txt"; then
            echo 'Scholar APK still advertises an upstream link or OAuth callback' >&2
            exit 1
          fi

      - name: cache AVD snapshot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34-aosp

      - name: create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"

      - name: run Android e2e lane
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r "$APK"
            adb shell pm list packages io.github.gkwfhv.readestscholar | grep -Fx 'package:io.github.gkwfhv.readestscholar'
            cd apps/readest-app && READEST_ANDROID_SCREENSHOT_PATH="$GITHUB_WORKSPACE/scholar-android-reader.png" READEST_ANDROID_PACKAGE=io.github.gkwfhv.readestscholar READEST_ANDROID_REQUIRE_DEVICE=true pnpm test:android
            cd apps/readest-app && READEST_ANDROID_PACKAGE=io.github.gkwfhv.readestscholar pnpm exec tsx scripts/capture-scholar-android-library.ts "$GITHUB_WORKSPACE/scholar-android-library.png"

      - name: upload Android screen evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scholar-android-reader-screen
          path: |
            scholar-android-reader.png
            scholar-android-library.png
          if-no-files-found: error
          retention-days: 7
